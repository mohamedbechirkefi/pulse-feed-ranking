# SPDX-License-Identifier: LicenseRef-PULSE-NC-Research-1.0
[project]
name = "pulse-feed-ranking"
version = "0.1.0"
description = "PULSE: simulated recommendation feedback loops and exposure diversity (research code)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Custom licence; see LICENSE and NOTICE.md. Not an OSI licence, so no SPDX expression is given here.
license = { file = "LICENSE" }
authors = [{ name = "Mohamed Bechir Kefi" }]
dependencies = [
    "numpy>=2.3,<2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
]

[tool.uv]
# Resolve only versions published at least two weeks before 2026-11-24 (M0 rule).
exclude-newer = "2026-11-10T00:00:00Z"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
